name: Deploy Apps to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Build Customer App (Root /dream.project/)
      - name: Install and build Customer App
        run: |
          cd customer-app
          npm install
          npm run build

      # 2. Build Vendor App (Subpath /dream.project/vendor/)
      - name: Install and build Vendor App
        run: |
          cd vendor-app
          npm install
          npm run build

      # 3. Build Admin App (Subpath /dream.project/admin/)
      - name: Install and build Admin App
        run: |
          cd admin-app
          npm install
          npm run build

      # 4. Assemble Unified Deployment Directory
      - name: Combine build outputs
        run: |
          mkdir -p public_deploy
          # Copy customer-app to root
          cp -r customer-app/dist/* public_deploy/
          # Copy vendor-app to /vendor subfolder
          mkdir -p public_deploy/vendor
          cp -r vendor-app/dist/* public_deploy/vendor/
          # Copy admin-app to /admin subfolder
          mkdir -p public_deploy/admin
          cp -r admin-app/dist/* public_deploy/admin/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './public_deploy'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
